<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Estimates — Fast Glass & Windows</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(180deg,#f8fafc,#f1f5f9)}
    .card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;box-shadow:0 1px 2px rgba(15,23,42,.04)}
    .badge{font-size:10px;font-weight:700;padding:2px 8px;border-radius:999px;text-transform:uppercase}
    .badge.saved{background:#eff6ff;color:#1d4ed8}
    .badge.signed{background:#ecfdf5;color:#047857}
    @media print {
      body{background:#fff}
      header, .no-print { display:none !important; }
      #proposalView { display:block !important; }
      #listView { display:none !important; }
      .proposal-sheet { box-shadow:none; border:none; }
    }
  </style>
</head>
<body class="min-h-screen pb-10">
<header class="bg-white/95 border-b border-slate-200 sticky top-0 z-20 no-print">
  <div class="max-w-5xl mx-auto px-4 py-3 flex items-center justify-between gap-2">
    <div>
      <h1 class="text-sm font-bold text-slate-900">My Estimates</h1>
      <p id="who" class="text-[11px] text-slate-500">…</p>
    </div>
    <div class="flex gap-2 text-[11px]">
      <a href="/" class="border border-slate-200 rounded-lg px-2 py-1.5 text-slate-500 hover:text-blue-600">Calculator</a>
      <a id="adminLink" href="/admin" class="hidden border border-slate-200 rounded-lg px-2 py-1.5 text-slate-500 hover:text-blue-600">Admin</a>
      <button id="logoutBtn" class="border border-slate-200 rounded-lg px-2 py-1.5 text-slate-500 hover:text-red-600">Logout</button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 pt-4 space-y-3">
  <div id="listView">
    <div class="card p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 no-print">
      <p class="text-sm text-slate-600">Save a full cart as one quote from the calculator, then open a proposal to print or share.</p>
      <a href="/" class="inline-flex justify-center bg-blue-600 text-white text-sm font-semibold rounded-lg px-4 py-2">New calculation</a>
    </div>
    <div id="list" class="space-y-3"></div>
    <p id="empty" class="hidden text-center text-sm text-slate-400 py-10">No saved estimates yet. On the calculator, add items to the quote cart and tap <strong>Save quote</strong>.</p>
  </div>

  <div id="proposalView" class="hidden">
    <div class="no-print flex flex-wrap gap-2 mb-3">
      <button type="button" id="backListBtn" class="border border-slate-200 rounded-lg px-3 py-2 text-xs font-semibold text-slate-600">← Back to list</button>
      <button type="button" id="printBtn" class="bg-slate-900 text-white rounded-lg px-3 py-2 text-xs font-semibold">🖨 Print / Save PDF</button>
      <button type="button" id="signBtn" class="hidden bg-emerald-600 text-white rounded-lg px-3 py-2 text-xs font-semibold">Sign quote</button>
    </div>
    <article id="proposalSheet" class="proposal-sheet card p-6 md:p-8 bg-white"></article>
  </div>
</main>

<script>
const TOKEN_KEY='fg_admin_token';
const USER_KEY='fg_admin_user';
const COMPANY='Fast Glass & Windows';
const PHONE='213-566-8886';
let token=sessionStorage.getItem(TOKEN_KEY)||'';
let me=null;
let current=null;

async function api(path,opts={}){
  const r=await fetch(path,{...opts,headers:{'Content-Type':'application/json','Authorization':`Bearer ${token}`,...(opts.headers||{})}});
  if(r.status===401){location.href='/login';throw new Error('auth');}
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.detail||`Error ${r.status}`);
  return j;
}
function money(n){return n==null?'—':`$${Number(n).toLocaleString()}`;}
function esc(s){const d=document.createElement('div');d.textContent=s??'';return d.innerHTML;}

function showList(){
  proposalView.classList.add('hidden');
  listView.classList.remove('hidden');
  history.replaceState({},'', '/portal');
}
function showProposal(){
  listView.classList.add('hidden');
  proposalView.classList.remove('hidden');
}

function proposalItems(est){
  const p=est.payload||{};
  if(Array.isArray(p.items) && p.items.length){
    return p.items.map(it=>({
      label:it.label||'Item',
      mid:it.mid_price??it.midPrice,
      detail:it.area?`${it.area} sqft`:(it.qty>1?`${it.qty} units`:''),
    }));
  }
  return [{
    label:est.title||'Glass estimate',
    mid:est.mid_price,
    detail:p?.result?.total_area_sqft?`${p.result.total_area_sqft} sqft`:'',
  }];
}

function renderProposal(est){
  current=est;
  const p=est.payload||{};
  const client=p.client_name||'';
  const company=p.company||COMPANY;
  const phone=p.phone||PHONE;
  const items=proposalItems(est);
  const rows=items.map(it=>`
    <tr class="border-b border-slate-100">
      <td class="py-2.5 pr-3 text-sm text-slate-800">${esc(it.label)}${it.detail?`<div class="text-[11px] text-slate-400">${esc(it.detail)}</div>`:''}</td>
      <td class="py-2.5 text-right text-sm font-semibold text-slate-900 whitespace-nowrap">${money(it.mid)}</td>
    </tr>`).join('');

  proposalSheet.innerHTML=`
    <header class="flex flex-col sm:flex-row sm:items-start justify-between gap-4 border-b border-slate-200 pb-4 mb-4">
      <div>
        <div class="text-lg font-bold text-slate-900">${esc(company)}</div>
        <div class="text-xs text-slate-500 mt-0.5">Glass repair estimate / proposal</div>
        <div class="text-sm font-semibold text-blue-700 mt-2">${esc(phone)}</div>
      </div>
      <div class="text-sm text-slate-600 sm:text-right">
        <div><span class="text-slate-400">Quote #</span> ${est.id}</div>
        <div><span class="text-slate-400">Date</span> ${esc((est.created_at||'').slice(0,10))}</div>
        <div><span class="text-slate-400">Status</span> ${esc(est.status)}</div>
        <div class="mt-1 text-xs">Prepared by ${esc(est.owner?.display_name||est.owner?.user_id||'')}</div>
      </div>
    </header>
    <section class="mb-5">
      <div class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold mb-1">Client</div>
      <div class="text-base font-semibold text-slate-900">${esc(client||'—')}</div>
      <div class="text-sm text-slate-600 mt-1">${esc(est.title||'')}</div>
    </section>
    <section class="mb-5">
      <div class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold mb-2">Line items</div>
      <table class="w-full">
        <thead>
          <tr class="text-left text-[10px] uppercase text-slate-400 border-b">
            <th class="pb-2 font-semibold">Description</th>
            <th class="pb-2 font-semibold text-right">Amount</th>
          </tr>
        </thead>
        <tbody>${rows}</tbody>
      </table>
    </section>
    <section class="bg-slate-50 rounded-xl p-4 mb-5">
      <div class="flex justify-between items-baseline gap-3">
        <span class="text-sm font-semibold text-slate-700">Estimate total</span>
        <span class="text-2xl font-bold text-blue-700">${money(est.mid_price)}</span>
      </div>
      <div class="mt-2 text-sm text-slate-600">Customer range: <strong>${money(est.range_min)} – ${money(est.range_max)}</strong></div>
    </section>
    ${est.notes?`<section class="mb-5"><div class="text-[11px] uppercase tracking-wide text-slate-400 font-semibold mb-1">Notes</div><p class="text-sm text-slate-700 whitespace-pre-wrap">${esc(est.notes)}</p></section>`:''}
    <footer class="border-t border-slate-200 pt-4 text-xs text-slate-500 space-y-1">
      <p>This is an estimate, not a final invoice. Final price may vary after site inspection.</p>
      <p>${esc(company)} · ${esc(phone)} · Beverly Hills / Greater LA</p>
      ${est.signed_at?`<p class="text-emerald-700 font-semibold">Signed ${esc(est.signed_at)} by ${esc(est.signed_by_user_id||'')}</p>`:''}
    </footer>`;

  signBtn.classList.toggle('hidden', est.status==='signed');
  signBtn.onclick=async()=>{
    signBtn.disabled=true;
    try{
      const updated=await api(`/api/estimates/${est.id}/sign`,{method:'POST'});
      // reload full payload
      const full=await api(`/api/estimates/${est.id}`);
      renderProposal(full);
      await loadList();
    }catch(e){alert(e.message);signBtn.disabled=false;}
  };
  showProposal();
  history.replaceState({},'', '/portal?id='+est.id);
}

function renderList(items){
  empty.classList.toggle('hidden', items.length>0);
  list.innerHTML=items.map(e=>`
    <div class="card p-4">
      <div class="flex items-start justify-between gap-3">
        <div class="min-w-0">
          <div class="flex items-center gap-2 mb-1 flex-wrap">
            <h2 class="text-sm font-semibold text-slate-900 truncate">${esc(e.title)}</h2>
            <span class="badge ${e.status}">${e.status}</span>
          </div>
          <p class="text-xs text-slate-500">${esc(e.owner.display_name||e.owner.user_id)} · ${esc(e.created_at||'')}</p>
          <p class="text-lg font-bold text-blue-600 mt-2">${money(e.mid_price)}</p>
          <p class="text-xs text-slate-500">Range ${money(e.range_min)} – ${money(e.range_max)}</p>
        </div>
        <div class="flex flex-col gap-2 no-print">
          <button data-open="${e.id}" class="text-xs font-semibold bg-slate-900 text-white rounded-lg px-3 py-2">Open proposal</button>
          ${e.status!=='signed'?`<button data-sign="${e.id}" class="text-xs font-semibold bg-emerald-600 text-white rounded-lg px-3 py-2">Sign</button>`:''}
        </div>
      </div>
    </div>`).join('');

  list.querySelectorAll('[data-open]').forEach(btn=>{
    btn.onclick=async()=>{
      try{
        const est=await api(`/api/estimates/${btn.dataset.open}`);
        renderProposal(est);
      }catch(e){alert(e.message);}
    };
  });
  list.querySelectorAll('[data-sign]').forEach(btn=>{
    btn.onclick=async()=>{
      btn.disabled=true;
      try{await api(`/api/estimates/${btn.dataset.sign}/sign`,{method:'POST'});await loadList();}
      catch(e){alert(e.message);btn.disabled=false;}
    };
  });
}

async function loadList(){
  const items=await api('/api/estimates?mine=1');
  renderList(items);
  return items;
}

backListBtn.onclick=()=>showList();
printBtn.onclick=()=>window.print();
logoutBtn.onclick=async()=>{
  try{await api('/api/admin/auth/logout',{method:'POST'});}catch{}
  sessionStorage.removeItem(TOKEN_KEY);
  sessionStorage.removeItem(USER_KEY);
  location.href='/login';
};

(async()=>{
  if(!token){location.href='/login';return;}
  me=await api('/api/admin/auth/me');
  who.textContent=`${me.display_name||me.user_id} · ${me.email}`;
  if(me.role==='superadmin') adminLink.classList.remove('hidden');
  await loadList();
  const id=new URLSearchParams(location.search).get('id');
  if(id){
    try{
      const est=await api(`/api/estimates/${id}`);
      renderProposal(est);
    }catch(e){alert(e.message);}
  }
})();
</script>
</body>
</html>
